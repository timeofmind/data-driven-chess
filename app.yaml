# Chess — a demonstration app for the data-driven framework, read by the datadriven
# Caddy handler. The data: model/*.yaml. The interface: pages/*.yaml. Look: theme/.
name: "Chess"
tagline: "A game of chess described by its data model: two players, a board, and the rules of the pieces."
model: [model/*.yaml]
pages: [pages/*.yaml]
theme: theme
timezone: America/Vancouver

signup:
  enabled: true
  intro: "Sign up, challenge another player — or play yourself — and drag your pieces."

# A forgotten password: /forgot emails a link (a PasswordReset record sent by the
# mail listener), /reset?code=… sets the new one. See model/30-mail.yaml.
password_reset: {class: PasswordReset, expires: 1h}

nav: [games, challenges, new-game]
