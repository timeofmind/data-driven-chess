# The default password-reset email; a MailTemplate record named password-reset
# in the database replaces it (edit it at /mail-templates as an admin).
# Templates over .record (the PasswordReset), .player (the account) and .base_url.
to: "{{.player.email}}"
subject: "Reset your Chess password"
body: |
  Hello {{.player.name}},

  Someone asked to reset the password of your Chess account at {{.base_url}}.
  If it was you, choose a new password here:

  {{.base_url}}/reset?code={{.record.code}}

  The link is good for an hour and works once. If it wasn't you, ignore this
  message — your password stays as it is.
