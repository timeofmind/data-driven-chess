# nginx: the two chess nodes. Put the upstream in /etc/nginx/conf.d/chess-upstream.conf
# and the location in the holmgren.ca https server block (sites-available/default).
# The app is mounted below /chess, so the path is passed through unchanged.
upstream chess_nodes {
	server 127.0.0.1:8110;
	server 127.0.0.1:8111;
}

	location /chess {
		proxy_pass http://chess_nodes;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}
