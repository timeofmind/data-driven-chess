# Players sign up and in; a player owns the pieces of their colour in each game.
classes:
  Player:
    description: "Someone who plays"
    display: name
    auth: {login: email, password: password_hash, display: name}
    access: {owner: id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: email, type: string, required: true, max: 200, read: owner, label: "Email"}
      - {name: password_hash, type: password, required: true, min: 10, label: "Password", description: "At least 10 characters"}
      - {name: name, type: string, required: true, max: 60, label: "Name"}
    constraints:
      unique: [[email]]
