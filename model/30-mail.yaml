# Mail the app sends, and the password reset that sends it. A MailTemplate is
# an email by name — to whom, the subject and the body, Go templates over the
# record sent and what it belongs to (.record, .player, .base_url) — kept in
# the database so an admin can edit it; the app ships a default of the same
# name in mail/<name>.yaml, used when there is no record. A PasswordReset is
# one request to choose a new password: the handler's /forgot page saves it
# with a fresh code for the account, the routing sends it to the mail
# listener (the local exim4 on port 25, no authentication) with the
# password-reset template, and /reset?code=… lets the account's owner choose
# the new password once, within the hour.
enums:
  MailStatus: {values: [queued, sent, failed], default: queued}
classes:
  MailTemplate:
    description: "An email the app sends, by name: to whom, the subject and the body"
    display: name
    access: {read: authenticated, write: nobody}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: name, type: string, required: true, max: 60, label: "Name", description: "What the routing calls it: password-reset"}
      - {name: to, type: string, required: true, max: 200, label: "To", description: "A template: {{.player.email}}"}
      - {name: subject, type: string, required: true, max: 200, label: "Subject"}
      - {name: body, type: text, required: true, label: "Body", description: "A template over .record (the reset), .player and .base_url; the link is {{.base_url}}/reset?code={{.record.code}}"}
      - {name: vars, type: text, label: "Variables", description: "YAML, name: template — then {name} in the subject or body is filled with it"}
    constraints: {unique: [[name]]}
  PasswordReset:
    description: "A request to choose a new password: a code emailed to the account, good for an hour, used once"
    access: {owner: player_id, read: owner, write: nobody}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: player_id, type: integer, required: true}
      - {name: email, type: string, max: 200, label: "Email"}
      - {name: code, type: string, required: true, max: 64, read_only: true}
      - {name: expires_at, type: datetime, read_only: true, label: "Expires"}
      - {name: used_at, type: datetime, read_only: true, label: "Used"}
      # The mail listener records how sending went.
      - {name: status, type: enum, enum: MailStatus, default: queued, read_only: true}
      - {name: sent_at, type: datetime, read_only: true}
      - {name: error, type: text, read_only: true}
    relationships:
      belongs_to:
        - {target: Player, via: player_id, name: player, on_delete: cascade}
