# A game of chess, described by its data alone. The framework knows nothing of
# chess: a game starts with its pieces (starts_with); a piece's square is a slot;
# the pieces on a square are a has_many by matching slots (match), whose where
# reads the piece as self.*; moving a piece writes its square, and the class's
# checks say what a legal move is (counts over those relationships: blockers,
# victims); triggers capture what was on the square, promote a pawn and hand the
# turn to the other side.
#
# A move may not leave your own king in check — so a king can't step into
# check, a piece can't uncover one, and in check the only moves are those that
# end it. The rule is one check on the moving piece: after the move, no enemy
# piece attacks my king's square. "Attacked" is asked of the pieces as they are:
# a slider on a line with the king's square attacks it when nothing stands
# between (a has_many counting the pieces between, inside the where listing the
# attackers), with the three differences between the stored position and the
# one after the move said in the where: the mover's old square is empty (its
# stored copy is left out by id), its new square is occupied (an attacker it
# stands in front of is blocked), and what stood there is taken. Knights, pawns
# and the other king attack by geometry alone. Nothing is stored for it beyond
# the game remembering where each king stands.
#
# Castling is a king's move to g1/c1/g8/c8 under its conditions — looked at
# only when a king makes that move, and never again for a side the game
# records as castled; the trigger places the rook. The clock: the time control chosen at the start, each move
# stamped as it reaches the server, its time off the mover's clock.
#
# The server never searches for a mate: the boards' scripts find it and report
# a Verdict, and a claimed checkmate is checked against the position (the
# losing king in check with every square beside it taken or attacked), so the
# winner's claim alone ends the game. Not described (a demonstration): en
# passant, and a flag fall ending the game (a side out of time can no longer
# move).
enums:
  Colour: {values: [white, black]}
  Kind: {values: [king, queen, rook, bishop, knight, pawn]}
  Status: {values: [playing, finished]}
  # How a game is played: remote, each side from its own account's browser;
  # in person, both sides from one browser (the pieces all belong to white's account).
  Mode:
    values: [remote, in_person]
    default: remote
    labels: {remote: "Remote — each of us moves from our own browser", in_person: "In person — we share one board"}
  Answer: {values: [accepted, declined], labels: {accepted: "Accept", declined: "Decline"}}
  # How a game ends, and its result.
  Result: {values: [white_wins, black_wins, draw], labels: {white_wins: "White wins", black_wins: "Black wins", draw: "Draw"}}
  Ending: {values: [checkmate, stalemate, agreed, king_taken], labels: {checkmate: "Checkmate", stalemate: "Stalemate", agreed: "Draw by agreement", king_taken: "The king was taken"}}
  # Time control: the minutes each side starts with and the seconds added to
  # its clock at the start of each of its moves (chosen when the game starts).
  TimeControl:
    values: [none, bullet_1_0, bullet_2_1, blitz_3_0, blitz_3_2, blitz_5_0, blitz_5_3, rapid_10_0, rapid_10_5, rapid_15_10, classical_30_0, classical_30_20]
    default: rapid_10_0
    labels: {none: "No clock", bullet_1_0: "1 min (bullet)", bullet_2_1: "2 min + 1 s (bullet)", blitz_3_0: "3 min (blitz)", blitz_3_2: "3 min + 2 s (blitz)", blitz_5_0: "5 min (blitz)", blitz_5_3: "5 min + 3 s (blitz)", rapid_10_0: "10 min (rapid)", rapid_10_5: "10 min + 5 s (rapid)", rapid_15_10: "15 min + 10 s (rapid)", classical_30_0: "30 min (classical)", classical_30_20: "30 min + 20 s (classical)"}
classes:
  # A challenge: one player invites another to a game, remote or in person,
  # saying which colour they take and the time control. The challenged player
  # is the record's party: only they answer it (write: party); accepting
  # starts the game (a trigger creates it, once). The challenger may withdraw
  # an unanswered one. Both are pushed to each player's challenges page.
  Challenge:
    description: "An invitation to play, from one player to another"
    title: "from.name + ' challenges ' + to.name"
    access: {owner: from_id, party: to_id, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: from_id, type: integer, required: true, label: "From"}
      - {name: to_id, type: integer, required: true, label: "Opponent"}
      - {name: mode, type: enum, enum: Mode, required: true, default: remote, write: creator, label: "How we play"}
      - {name: colour, type: enum, enum: Colour, required: true, default: white, write: creator, label: "I play", description: "The challenger's colour"}
      - {name: time_control, type: enum, enum: TimeControl, required: true, default: rapid_10_0, write: creator, label: "Time control"}
      - {name: answer, type: enum, enum: Answer, write: party, label: "Your answer", description: "Accepting starts the game"}
      - {name: withdrawn, type: boolean, default: false, label: "Withdrawn", description: "The challenger took it back"}
    computed:
      - {name: status, label: "Status", expr: "if(withdrawn, 'withdrawn', coalesce(answer, 'open'))"}
    relationships:
      belongs_to:
        # A player who leaves takes their challenges with them.
        - {target: Player, via: from_id, name: from, link: readable, on_delete: cascade}
        - {target: Player, via: to_id, name: to, link: readable, on_delete: cascade}
      has_many:
        - {target: Game, via: challenge_id, name: games}
    checks:
      - {check: "from_id != to_id", message: "challenge someone else — to play yourself, start a game", slot: to_id}
      - {check: "not withdrawn or answer == null", message: "it has been answered", slot: withdrawn}
    triggers:
      # Accepted: the game, once — white and black by the challenger's colour.
      - create: Game
        if: "self.answer == 'accepted' and not self.withdrawn and self.games.count == 0"
        set:
          white_id: "if(self.colour == 'white', self.from_id, self.to_id)"
          black_id: "if(self.colour == 'white', self.to_id, self.from_id)"
          time_control: self.time_control
          mode: self.mode
          challenge_id: self.id
  Game:
    description: "A game between two players; white moves first"
    title: "white.name + ' vs ' + black.name"
    access: {owner: white_id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: white_id, type: integer, required: true, label: "White"}
      - {name: black_id, type: integer, required: true, label: "Black"}
      # Remote: each side moves from its own account; in person: both from
      # white's (every piece belongs to white's account). From a challenge, or started by hand.
      - {name: mode, type: enum, enum: Mode, required: true, default: in_person, write: creator, label: "How it is played"}
      - {name: challenge_id, type: integer, read_only: true}
      - {name: turn, type: enum, enum: Colour, default: white, read_only: true, label: "To move"}
      - {name: status, type: enum, enum: Status, default: playing, read_only: true}
      - {name: winner, type: enum, enum: Colour, read_only: true}
      - {name: result, type: enum, enum: Result, read_only: true, label: "Result"}
      - {name: ended_by, type: enum, enum: Ending, read_only: true, label: "Ended by"}
      - {name: move_count, type: integer, default: 0, read_only: true, label: "Moves"}
      - {name: last_move, type: string, read_only: true, label: "Last move"}
      - {name: last_piece_id, type: integer, read_only: true}
      - {name: last_square, type: string, read_only: true}
      - {name: pgn, type: text, read_only: true, label: "PGN", description: "The moves from the start, in portable game notation"}
      - {name: check, type: boolean, read_only: true, default: false, label: "In check", description: "Whether the side to move is in check (the last move gave it)"}
      # Castled: recorded by the castle itself, so no later move of that side ever looks at castling again.
      - {name: white_castled, type: boolean, read_only: true, default: false, label: "White castled"}
      - {name: black_castled, type: boolean, read_only: true, default: false, label: "Black castled"}
      # Where each king stands (file and rank, 1–8), kept by the trigger of a king's move.
      - {name: white_king_file, type: integer, read_only: true, default: 5}
      - {name: white_king_rank, type: integer, read_only: true, default: 1}
      - {name: black_king_file, type: integer, read_only: true, default: 5}
      - {name: black_king_rank, type: integer, read_only: true, default: 8}
      # The clock: created_at is when the game started; in milliseconds since
      # 1970 (the datetime is to the second), when it started and when each move
      # reached the server, so every move's time is the server's measure. The
      # time control chosen at the start gives each side its starting time and
      # the increment added at the start of each of its moves; a side's clock
      # (white_ms, black_ms) is what it had left when it last moved — null
      # until then (the starting time), and always null without a clock. The
      # time a move takes comes off the mover's clock, with the increment on.
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, label: "Started"}
      - {name: started_ms, type: integer, read_only: true, default_expr: now_ms}
      - {name: last_move_ms, type: integer, read_only: true}
      - {name: prev_move_ms, type: integer, read_only: true}
      - {name: time_control, type: enum, enum: TimeControl, required: true, default: rapid_10_0, write: creator, label: "Time control", description: "The minutes each side starts with, and the seconds added to its clock at the start of each of its moves"}
      - {name: initial_ms, type: integer, read_only: true, description: "Each side's starting time, in milliseconds; blank without a clock",
         default_expr: "if(time_control == 'none', null, 60000 * if(time_control == 'bullet_1_0', 1, if(time_control == 'bullet_2_1', 2, if(time_control == 'blitz_3_0' or time_control == 'blitz_3_2', 3, if(time_control == 'blitz_5_0' or time_control == 'blitz_5_3', 5, if(time_control == 'rapid_10_0' or time_control == 'rapid_10_5', 10, if(time_control == 'rapid_15_10', 15, 30)))))))"}
      - {name: increment_ms, type: integer, read_only: true, description: "Added to a side's clock at the start of each of its moves, in milliseconds",
         default_expr: "1000 * if(time_control == 'bullet_2_1', 1, if(time_control == 'blitz_3_2', 2, if(time_control == 'blitz_5_3', 3, if(time_control == 'rapid_10_5', 5, if(time_control == 'rapid_15_10', 10, if(time_control == 'classical_30_20', 20, 0))))))"}
      - {name: white_ms, type: integer, read_only: true, label: "White's clock (ms)", description: "What white had left when it last moved, in milliseconds; blank until then (its starting time), or without a clock"}
      - {name: black_ms, type: integer, read_only: true, label: "Black's clock (ms)", description: "What black had left when it last moved, in milliseconds; blank until then (its starting time), or without a clock"}
    relationships:
      belongs_to:
        # A player who leaves takes their games with them (and the pieces, moves and verdicts with the game).
        - {target: Player, via: white_id, name: white, link: readable, on_delete: cascade}
        - {target: Player, via: black_id, name: black, link: readable, on_delete: cascade}
        - {target: Challenge, via: challenge_id, name: challenge, on_delete: set_null}
      has_many:
        - {target: Piece, via: game_id, name: pieces}
        - {target: Move, via: game_id, name: moves}
        - {target: Verdict, via: game_id, name: verdicts}
    starts_with:
      pieces:
        - {colour: "'white'", kind: "'rook'", square: "'a1'", owner_id: white_id}
        - {colour: "'white'", kind: "'knight'", square: "'b1'", owner_id: white_id}
        - {colour: "'white'", kind: "'bishop'", square: "'c1'", owner_id: white_id}
        - {colour: "'white'", kind: "'queen'", square: "'d1'", owner_id: white_id}
        - {colour: "'white'", kind: "'king'", square: "'e1'", owner_id: white_id}
        - {colour: "'white'", kind: "'bishop'", square: "'f1'", owner_id: white_id}
        - {colour: "'white'", kind: "'knight'", square: "'g1'", owner_id: white_id}
        - {colour: "'white'", kind: "'rook'", square: "'h1'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'a2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'b2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'c2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'d2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'e2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'f2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'g2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'h2'", owner_id: white_id}
        - {colour: "'black'", kind: "'rook'", square: "'a8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'knight'", square: "'b8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'bishop'", square: "'c8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'queen'", square: "'d8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'king'", square: "'e8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'bishop'", square: "'f8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'knight'", square: "'g8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'rook'", square: "'h8'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'a7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'b7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'c7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'d7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'e7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'f7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'g7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
        - {colour: "'black'", kind: "'pawn'", square: "'h7'", owner_id: "if(mode == 'in_person', white_id, black_id)"}
  Piece:
    description: "A piece of a game, on a square until it is taken; its owner moves it"
    access: {owner: owner_id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: game_id, type: integer, required: true}
      - {name: owner_id, type: integer, required: true}
      - {name: colour, type: enum, enum: Colour, required: true}
      - {name: kind, type: enum, enum: Kind, required: true}
      - {name: square, type: string, max: 2, description: "Where it stands, a–h then 1–8; blank once taken"}
      - {name: captured, type: boolean, default: false, label: "Taken"}
      - {name: file, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) + 1"}
      - {name: rank, type: integer, default_expr: "index('12345678', substr(square, 1, 1)) + 1"}
      - {name: diag_a, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) - index('12345678', substr(square, 1, 1))"}
      - {name: diag_b, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) + index('12345678', substr(square, 1, 1))"}
      - {name: from_file, type: integer}
      - {name: from_rank, type: integer}
      - {name: promoting, type: boolean, default: false}
      # My king's square after this move (my own new square if I am the king),
      # set as the move is checked, so the rules can ask whether it is attacked.
      - {name: k_file, type: integer}
      - {name: k_rank, type: integer}
      - {name: k_diag_a, type: integer}
      - {name: k_diag_b, type: integer}
      # Castling: how often the piece has moved (a king and rook may castle only
      # on their first), castled marks the rook a castle placed (its save fires no
      # move), and k2_* is the square the king crosses when castling (null otherwise).
      - {name: moves_made, type: integer, default: 0, read_only: true}
      - {name: castled, type: boolean, default: false, read_only: true}
      - {name: k2_file, type: integer}
      - {name: k2_rank, type: integer}
      - {name: k2_diag_a, type: integer}
      - {name: k2_diag_b, type: integer}
      # The enemy king's square, set the same way, so the move can tell whether it gives check.
      - {name: ek_file, type: integer}
      - {name: ek_rank, type: integer}
      - {name: ek_diag_a, type: integer}
      - {name: ek_diag_b, type: integer}
    computed:
      # Whether this move gives check: this piece attacks the enemy king from its
      # new square, or another of its side does along a line this move uncovered.
      - {name: gives_check, expr: "from_file != null and not captured and (((kind == 'pawn' and abs(file - ek_file) == 1 and ek_rank - rank == if(colour == 'white', 1, -1)) or (kind == 'knight' and abs(file - ek_file) * abs(rank - ek_rank) == 2) or (((kind == 'rook' or kind == 'queen') and (file == ek_file or rank == ek_rank) or (kind == 'bishop' or kind == 'queen') and (diag_a == ek_diag_a or diag_b == ek_diag_b)) and between_ek.count == 0)) or discovered.count > 0)"}
      # The move's notation, read while the trigger records it (the victims still there).
      - {name: san, expr: "if(kind == 'king' and from_file != null and abs(file - from_file) == 2, if(file == 7, 'O-O', 'O-O-O'), if(kind == 'pawn' or promoting, if(victims.count > 0, substr('abcdefgh', from_file - 1, 1) + 'x', ''), if(kind == 'king', 'K', if(kind == 'queen', 'Q', if(kind == 'rook', 'R', if(kind == 'bishop', 'B', 'N')))) + if(victims.count > 0, 'x', '')) + square + if(promoting, '=Q', ''))"}
      - {name: glyph, expr: "if(colour == 'white', if(kind == 'king', '♔', if(kind == 'queen', '♕', if(kind == 'rook', '♖', if(kind == 'bishop', '♗', if(kind == 'knight', '♘', '♙'))))), if(kind == 'king', '♚', if(kind == 'queen', '♛', if(kind == 'rook', '♜', if(kind == 'bishop', '♝', if(kind == 'knight', '♞', '♟'))))))"}
    relationships:
      belongs_to:
        - {target: Game, via: game_id, on_delete: cascade}
        - {target: Player, via: owner_id, name: owner, link: readable, on_delete: cascade}
      has_many:
        # The pieces on this piece's square, other than itself.
        - {target: Piece, name: victims, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour != self.colour"}
        - {target: Piece, name: own_here, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour == self.colour"}
        - {target: Piece, name: king_victims, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour != self.colour and kind == 'king'"}
        # The pieces strictly between this piece and the king square of the piece
        # whose move is being checked (outer.k_*), on the line through both — that
        # piece's stored copy left out (its old square is empty) and whatever stands
        # on its new square too (taken). None: a clear line.
        - {target: Piece, name: between_k, match: {game_id: game_id},
           where: "id != self.id and id != outer.id and captured == false and (file != outer.file or rank != outer.rank) and file >= min(self.file, outer.k_file) and file <= max(self.file, outer.k_file) and rank >= min(self.rank, outer.k_rank) and rank <= max(self.rank, outer.k_rank) and (file != self.file or rank != self.rank) and (file != outer.k_file or rank != outer.k_rank) and ((rank == self.rank and self.rank == outer.k_rank) or (file == self.file and self.file == outer.k_file) or (diag_a == self.diag_a and self.diag_a == outer.k_diag_a) or (diag_b == self.diag_b and self.diag_b == outer.k_diag_b))"}
        # The enemy pieces that would attack my king's square once this move is
        # made: by geometry, or a slider on a line with it with nothing between —
        # neither a piece (between_k, the candidate's) nor this piece itself on its
        # new square. The piece on my new square is taken, so it is no attacker.
        - {target: Piece, name: king_attackers, match: {game_id: game_id},
           where: "id != self.id and captured == false and colour != self.colour and (file != self.file or rank != self.rank) and ((kind == 'knight' and abs(file - self.k_file) * abs(rank - self.k_rank) == 2) or (kind == 'pawn' and abs(file - self.k_file) == 1 and rank - self.k_rank == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - self.k_file), abs(rank - self.k_rank)) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == self.k_rank or file == self.k_file) or (kind == 'bishop' or kind == 'queen') and (diag_a == self.k_diag_a or diag_b == self.k_diag_b)) and between_k.count == 0 and not ((rank == self.k_rank and self.rank == rank and (file - self.file) * (self.k_file - self.file) < 0) or (file == self.k_file and self.file == file and (rank - self.rank) * (self.k_rank - self.rank) < 0) or (diag_a == self.k_diag_a and self.diag_a == diag_a and (file - self.file) * (self.k_file - self.file) < 0) or (diag_b == self.k_diag_b and self.diag_b == diag_b and (file - self.file) * (self.k_file - self.file) < 0))))"}
        # The pieces strictly between my new square and the enemy king's, on their line.
        - {target: Piece, name: between_ek, match: {game_id: game_id},
           where: "id != self.id and captured == false and file >= min(self.file, self.ek_file) and file <= max(self.file, self.ek_file) and rank >= min(self.rank, self.ek_rank) and rank <= max(self.rank, self.ek_rank) and (file != self.file or rank != self.rank) and (file != self.ek_file or rank != self.ek_rank) and ((rank == self.rank and self.rank == self.ek_rank) or (file == self.file and self.file == self.ek_file) or (diag_a == self.diag_a and self.diag_a == self.ek_diag_a) or (diag_b == self.diag_b and self.diag_b == self.ek_diag_b))"}
        # The same for a candidate of the moving piece's side (outer), to the enemy
        # king's square: the mover's stored copy left out (its old square is empty).
        - {target: Piece, name: between_ek_of, match: {game_id: game_id},
           where: "id != self.id and id != outer.id and captured == false and file >= min(self.file, outer.ek_file) and file <= max(self.file, outer.ek_file) and rank >= min(self.rank, outer.ek_rank) and rank <= max(self.rank, outer.ek_rank) and (file != self.file or rank != self.rank) and (file != outer.ek_file or rank != outer.ek_rank) and ((rank == self.rank and self.rank == outer.ek_rank) or (file == self.file and self.file == outer.ek_file) or (diag_a == self.diag_a and self.diag_a == outer.ek_diag_a) or (diag_b == self.diag_b and self.diag_b == outer.ek_diag_b))"}
        # My side's other sliders that attack the enemy king once this move is made
        # (a line this move uncovered), not blocked by this piece on its new square.
        - {target: Piece, name: discovered, match: {game_id: game_id},
           where: "id != self.id and captured == false and colour == self.colour and (((kind == 'rook' or kind == 'queen') and (rank == self.ek_rank or file == self.ek_file) or (kind == 'bishop' or kind == 'queen') and (diag_a == self.ek_diag_a or diag_b == self.ek_diag_b)) and between_ek_of.count == 0 and not ((rank == self.ek_rank and self.rank == rank and (file - self.file) * (self.ek_file - self.file) < 0) or (file == self.ek_file and self.file == file and (rank - self.rank) * (self.ek_rank - self.rank) < 0) or (diag_a == self.ek_diag_a and self.diag_a == diag_a and (file - self.file) * (self.ek_file - self.file) < 0) or (diag_b == self.ek_diag_b and self.diag_b == diag_b and (file - self.file) * (self.ek_file - self.file) < 0)))"}
        # Castling: the unmoved rook in the corner the king castles toward.
        - {target: Piece, name: castle_rook, match: {game_id: game_id},
           where: "kind == 'rook' and colour == self.colour and captured == false and moves_made == 0 and rank == self.rank and file == if(self.file == 7, 8, 1)"}
        # Pieces on the rank between the king's first square and that rook.
        - {target: Piece, name: between_castle, match: {game_id: game_id},
           where: "id != self.id and captured == false and rank == self.rank and file > min(self.from_file, if(self.file == 7, 8, 1)) and file < max(self.from_file, if(self.file == 7, 8, 1))"}
        # The square the king crosses when castling (k2_*): attacked, as for the king's square.
        - {target: Piece, name: between_k2, match: {game_id: game_id},
           where: "id != self.id and id != outer.id and captured == false and (file != outer.file or rank != outer.rank) and file >= min(self.file, outer.k2_file) and file <= max(self.file, outer.k2_file) and rank >= min(self.rank, outer.k2_rank) and rank <= max(self.rank, outer.k2_rank) and (file != self.file or rank != self.rank) and (file != outer.k2_file or rank != outer.k2_rank) and ((rank == self.rank and self.rank == outer.k2_rank) or (file == self.file and self.file == outer.k2_file) or (diag_a == self.diag_a and self.diag_a == outer.k2_diag_a) or (diag_b == self.diag_b and self.diag_b == outer.k2_diag_b))"}
        - {target: Piece, name: pass_attackers, match: {game_id: game_id},
           where: "id != self.id and captured == false and colour != self.colour and (file != self.file or rank != self.rank) and ((kind == 'knight' and abs(file - self.k2_file) * abs(rank - self.k2_rank) == 2) or (kind == 'pawn' and abs(file - self.k2_file) == 1 and rank - self.k2_rank == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - self.k2_file), abs(rank - self.k2_rank)) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == self.k2_rank or file == self.k2_file) or (kind == 'bishop' or kind == 'queen') and (diag_a == self.k2_diag_a or diag_b == self.k2_diag_b)) and between_k2.count == 0 and not ((rank == self.k2_rank and self.rank == rank and (file - self.file) * (self.k2_file - self.file) < 0) or (file == self.k2_file and self.file == file and (rank - self.rank) * (self.k2_rank - self.rank) < 0) or (diag_a == self.k2_diag_a and self.diag_a == diag_a and (file - self.file) * (self.k2_file - self.file) < 0) or (diag_b == self.k2_diag_b and self.diag_b == diag_b and (file - self.file) * (self.k2_file - self.file) < 0))))"}
        # A claimed checkmate (Verdict, the outer record): the pieces strictly
        # between a candidate attacker and the square beside the losing king
        # in each direction (outer.lk_* + the offset), on their line — the
        # losing king itself left out, since it would be the one moving there.
        - {target: Piece, name: vbtw_n, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, outer.lk_file) and file <= max(self.file, outer.lk_file) and rank >= min(self.rank, (outer.lk_rank + 1)) and rank <= max(self.rank, (outer.lk_rank + 1)) and (file != self.file or rank != self.rank) and (file != outer.lk_file or rank != (outer.lk_rank + 1)) and ((rank == self.rank and self.rank == (outer.lk_rank + 1)) or (file == self.file and self.file == outer.lk_file) or (file - rank == self.file - self.rank and self.file - self.rank == outer.lk_file - (outer.lk_rank + 1)) or (file + rank == self.file + self.rank and self.file + self.rank == outer.lk_file + (outer.lk_rank + 1)))"}
        - {target: Piece, name: vbtw_ne, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file + 1)) and file <= max(self.file, (outer.lk_file + 1)) and rank >= min(self.rank, (outer.lk_rank + 1)) and rank <= max(self.rank, (outer.lk_rank + 1)) and (file != self.file or rank != self.rank) and (file != (outer.lk_file + 1) or rank != (outer.lk_rank + 1)) and ((rank == self.rank and self.rank == (outer.lk_rank + 1)) or (file == self.file and self.file == (outer.lk_file + 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file + 1) - (outer.lk_rank + 1)) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file + 1) + (outer.lk_rank + 1)))"}
        - {target: Piece, name: vbtw_e, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file + 1)) and file <= max(self.file, (outer.lk_file + 1)) and rank >= min(self.rank, outer.lk_rank) and rank <= max(self.rank, outer.lk_rank) and (file != self.file or rank != self.rank) and (file != (outer.lk_file + 1) or rank != outer.lk_rank) and ((rank == self.rank and self.rank == outer.lk_rank) or (file == self.file and self.file == (outer.lk_file + 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file + 1) - outer.lk_rank) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file + 1) + outer.lk_rank))"}
        - {target: Piece, name: vbtw_se, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file + 1)) and file <= max(self.file, (outer.lk_file + 1)) and rank >= min(self.rank, (outer.lk_rank - 1)) and rank <= max(self.rank, (outer.lk_rank - 1)) and (file != self.file or rank != self.rank) and (file != (outer.lk_file + 1) or rank != (outer.lk_rank - 1)) and ((rank == self.rank and self.rank == (outer.lk_rank - 1)) or (file == self.file and self.file == (outer.lk_file + 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file + 1) - (outer.lk_rank - 1)) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file + 1) + (outer.lk_rank - 1)))"}
        - {target: Piece, name: vbtw_s, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, outer.lk_file) and file <= max(self.file, outer.lk_file) and rank >= min(self.rank, (outer.lk_rank - 1)) and rank <= max(self.rank, (outer.lk_rank - 1)) and (file != self.file or rank != self.rank) and (file != outer.lk_file or rank != (outer.lk_rank - 1)) and ((rank == self.rank and self.rank == (outer.lk_rank - 1)) or (file == self.file and self.file == outer.lk_file) or (file - rank == self.file - self.rank and self.file - self.rank == outer.lk_file - (outer.lk_rank - 1)) or (file + rank == self.file + self.rank and self.file + self.rank == outer.lk_file + (outer.lk_rank - 1)))"}
        - {target: Piece, name: vbtw_sw, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file - 1)) and file <= max(self.file, (outer.lk_file - 1)) and rank >= min(self.rank, (outer.lk_rank - 1)) and rank <= max(self.rank, (outer.lk_rank - 1)) and (file != self.file or rank != self.rank) and (file != (outer.lk_file - 1) or rank != (outer.lk_rank - 1)) and ((rank == self.rank and self.rank == (outer.lk_rank - 1)) or (file == self.file and self.file == (outer.lk_file - 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file - 1) - (outer.lk_rank - 1)) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file - 1) + (outer.lk_rank - 1)))"}
        - {target: Piece, name: vbtw_w, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file - 1)) and file <= max(self.file, (outer.lk_file - 1)) and rank >= min(self.rank, outer.lk_rank) and rank <= max(self.rank, outer.lk_rank) and (file != self.file or rank != self.rank) and (file != (outer.lk_file - 1) or rank != outer.lk_rank) and ((rank == self.rank and self.rank == outer.lk_rank) or (file == self.file and self.file == (outer.lk_file - 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file - 1) - outer.lk_rank) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file - 1) + outer.lk_rank))"}
        - {target: Piece, name: vbtw_nw, match: {game_id: game_id},
           where: "id != self.id and captured == false and not (kind == 'king' and colour == outer.loser) and file >= min(self.file, (outer.lk_file - 1)) and file <= max(self.file, (outer.lk_file - 1)) and rank >= min(self.rank, (outer.lk_rank + 1)) and rank <= max(self.rank, (outer.lk_rank + 1)) and (file != self.file or rank != self.rank) and (file != (outer.lk_file - 1) or rank != (outer.lk_rank + 1)) and ((rank == self.rank and self.rank == (outer.lk_rank + 1)) or (file == self.file and self.file == (outer.lk_file - 1)) or (file - rank == self.file - self.rank and self.file - self.rank == (outer.lk_file - 1) - (outer.lk_rank + 1)) or (file + rank == self.file + self.rank and self.file + self.rank == (outer.lk_file - 1) + (outer.lk_rank + 1)))"}
        # Pieces on the line of the last move, strictly between its squares.
        - {target: Piece, name: blockers, match: {game_id: game_id},
           where: "id != self.id and captured == false and file >= min(self.file, self.from_file) and file <= max(self.file, self.from_file) and rank >= min(self.rank, self.from_rank) and rank <= max(self.rank, self.from_rank) and (file != self.file or rank != self.rank) and ((rank == self.rank and self.rank == self.from_rank) or (file == self.file and self.file == self.from_file) or (diag_a == self.diag_a and self.file - self.rank == self.from_file - self.from_rank) or (diag_b == self.diag_b and self.file + self.rank == self.from_file + self.from_rank))"}
    on_change:
      - slot: square
        set:
          from_file: old.file
          from_rank: old.rank
          moves_made: "old.moves_made + 1"
          # A rook a castle placed keeps its mark until it next moves on its own.
          castled: "if(old.castled, false, castled)"
          # The square a castling king crosses (two files from its first square).
          k2_file: "if(old.kind == 'king' and old.file == 5 and (index('abcdefgh', substr(square, 0, 1)) + 1 == 7 or index('abcdefgh', substr(square, 0, 1)) + 1 == 3), (index('abcdefgh', substr(square, 0, 1)) + 1 + 5) / 2, null)"
          k2_rank: "if(old.kind == 'king' and old.file == 5 and (index('abcdefgh', substr(square, 0, 1)) + 1 == 7 or index('abcdefgh', substr(square, 0, 1)) + 1 == 3), old.rank, null)"
          k2_diag_a: "if(old.kind == 'king' and old.file == 5 and (index('abcdefgh', substr(square, 0, 1)) + 1 == 7 or index('abcdefgh', substr(square, 0, 1)) + 1 == 3), (index('abcdefgh', substr(square, 0, 1)) + 1 + 5) / 2 - old.rank, null)"
          k2_diag_b: "if(old.kind == 'king' and old.file == 5 and (index('abcdefgh', substr(square, 0, 1)) + 1 == 7 or index('abcdefgh', substr(square, 0, 1)) + 1 == 3), (index('abcdefgh', substr(square, 0, 1)) + 1 + 5) / 2 + old.rank - 2, null)"
          file: "index('abcdefgh', substr(square, 0, 1)) + 1"
          rank: "index('12345678', substr(square, 1, 1)) + 1"
          diag_a: "index('abcdefgh', substr(square, 0, 1)) - index('12345678', substr(square, 1, 1))"
          diag_b: "index('abcdefgh', substr(square, 0, 1)) + index('12345678', substr(square, 1, 1))"
          # A pawn reaching the last rank becomes a queen (the move is still checked as a pawn's).
          promoting: "old.kind == 'pawn' and (substr(square, 1, 1) == '8' or substr(square, 1, 1) == '1')"
          kind: "if(kind == 'pawn' and (substr(square, 1, 1) == '8' or substr(square, 1, 1) == '1'), 'queen', kind)"
      # My king's square once this move is made, for the rule that it isn't attacked.
      - slot: square
        set:
          k_file: "if(kind == 'king', file, if(colour == 'white', game.white_king_file, game.black_king_file))"
          k_rank: "if(kind == 'king', rank, if(colour == 'white', game.white_king_rank, game.black_king_rank))"
          k_diag_a: "if(kind == 'king', file, if(colour == 'white', game.white_king_file, game.black_king_file)) - if(kind == 'king', rank, if(colour == 'white', game.white_king_rank, game.black_king_rank))"
          # (diag_b is file + rank - 2: both indexes from 0, as the slot's default computes it)
          k_diag_b: "if(kind == 'king', file, if(colour == 'white', game.white_king_file, game.black_king_file)) + if(kind == 'king', rank, if(colour == 'white', game.white_king_rank, game.black_king_rank)) - 2"
          ek_file: "if(colour == 'white', game.black_king_file, game.white_king_file)"
          ek_rank: "if(colour == 'white', game.black_king_rank, game.white_king_rank)"
          ek_diag_a: "if(colour == 'white', game.black_king_file, game.white_king_file) - if(colour == 'white', game.black_king_rank, game.white_king_rank)"
          ek_diag_b: "if(colour == 'white', game.black_king_file, game.white_king_file) + if(colour == 'white', game.black_king_rank, game.white_king_rank) - 2"
    checks:
      - {check: "captured or from_file == null or castled or game.status == 'playing'", message: "the game is over", slot: square}
      - {check: "captured or from_file == null or castled or colour == game.turn", message: "it's not your turn", slot: square}
      # With a clock: the mover's time (what it had left, plus the increment) must not have run out when the move arrives.
      - {check: "captured or from_file == null or castled or game.initial_ms == null or coalesce(if(colour == 'white', game.white_ms, game.black_ms), game.initial_ms) + game.increment_ms - (now_ms - coalesce(game.last_move_ms, game.started_ms)) > 0", message: "your time is up", slot: square}
      - {check: "captured or from_file == null or castled or own_here.count == 0", message: "one of your own pieces is there", slot: square}
      - {check: "captured or from_file == null or castled or kind != 'king' or max(abs(file - from_file), abs(rank - from_rank)) == 1 or (from_file == 5 and rank == from_rank and (file == 7 or file == 3) and moves_made == 1 and if(colour == 'white', game.white_castled, game.black_castled) == false and castle_rook.count == 1 and between_castle.count == 0 and game.check == false and pass_attackers.count == 0)", message: "a king moves one square, or castles: from its first square with a rook that hasn't moved, over empty squares, not out of or through check", slot: square}
      - {check: "captured or from_file == null or castled or king_attackers.count == 0", message: "your king would be in check", slot: square}
      - {check: "captured or from_file == null or castled or kind != 'queen' or promoting or ((abs(file - from_file) == abs(rank - from_rank) or file == from_file or rank == from_rank) and blockers.count == 0)", message: "a queen moves along a line, over empty squares", slot: square}
      - {check: "captured or from_file == null or castled or kind != 'rook' or ((file == from_file or rank == from_rank) and blockers.count == 0)", message: "a rook moves along a rank or file, over empty squares", slot: square}
      - {check: "captured or from_file == null or castled or kind != 'bishop' or (abs(file - from_file) == abs(rank - from_rank) and blockers.count == 0)", message: "a bishop moves along a diagonal, over empty squares", slot: square}
      - {check: "captured or from_file == null or castled or kind != 'knight' or abs(file - from_file) * abs(rank - from_rank) == 2", message: "a knight moves two squares one way and one the other", slot: square}
      - {check: "captured or from_file == null or castled or (kind != 'pawn' and not promoting) or (file == from_file and rank - from_rank == if(colour == 'white', 1, -1) and victims.count == 0) or (file == from_file and rank - from_rank == if(colour == 'white', 2, -2) and from_rank == if(colour == 'white', 2, 7) and victims.count == 0 and blockers.count == 0) or (abs(file - from_file) == 1 and rank - from_rank == if(colour == 'white', 1, -1) and victims.count == 1)", message: "a pawn moves one square forward (two from its first rank) and captures diagonally", slot: square}
    triggers:
      # Each fires for a piece that has moved (from_file is set by its first
      # move), in this order: a castle's rook, the game, the move's record, then
      # the capture. A rook a castle placed fires none of them.
      - via: castle_rook
        if: "self.kind == 'king' and not self.castled and self.from_file == 5 and self.rank == self.from_rank and abs(self.file - self.from_file) == 2"
        set: {square: "if(self.file == 7, 'f', 'd') + self.rank", castled: "true"}
      # The game: whose turn it is follows from the mover's colour (so a
      # repeated save changes nothing); the PGN grows; taking the king ends it.
      - via: game_id
        if: "not self.captured and self.from_file != null and not self.castled"
        set:
          turn: "if(self.colour == 'white', 'black', 'white')"
          move_count: "if(target.last_piece_id == self.id and target.last_square == self.square, target.move_count, target.move_count + 1)"
          # The moment this move reached the server, and the moment before it
          # (the previous move's, or the start), for the move's own time.
          last_move_ms: now_ms
          prev_move_ms: "coalesce(target.last_move_ms, target.started_ms)"
          # The mover's clock: what it had (its starting time until its first
          # move) plus the increment, less the time this move took.
          white_ms: "if(self.colour == 'white' and target.initial_ms != null, coalesce(target.white_ms, target.initial_ms) + target.increment_ms - (now_ms - coalesce(target.last_move_ms, target.started_ms)), target.white_ms)"
          black_ms: "if(self.colour == 'black' and target.initial_ms != null, coalesce(target.black_ms, target.initial_ms) + target.increment_ms - (now_ms - coalesce(target.last_move_ms, target.started_ms)), target.black_ms)"
          last_piece_id: self.id
          last_square: self.square
          white_castled: "if(self.kind == 'king' and self.colour == 'white' and abs(self.file - self.from_file) == 2, true, target.white_castled)"
          black_castled: "if(self.kind == 'king' and self.colour == 'black' and abs(self.file - self.from_file) == 2, true, target.black_castled)"
          white_king_file: "if(self.kind == 'king' and self.colour == 'white', self.file, target.white_king_file)"
          white_king_rank: "if(self.kind == 'king' and self.colour == 'white', self.rank, target.white_king_rank)"
          black_king_file: "if(self.kind == 'king' and self.colour == 'black', self.file, target.black_king_file)"
          black_king_rank: "if(self.kind == 'king' and self.colour == 'black', self.rank, target.black_king_rank)"
          last_move: "self.colour + ' ' + self.kind + ' to ' + self.square"
          pgn: "if(target.pgn == null, '', target.pgn) + if(self.colour == 'white', if(target.move_count > 0, ' ', '') + (target.move_count / 2 + 1) + '. ', ' ') + self.san + if(self.gives_check, '+', '') + if(self.king_victims.count > 0, if(self.colour == 'white', ' 1-0', ' 0-1'), '')"
          check: self.gives_check
          status: "if(self.king_victims.count > 0, 'finished', target.status)"
          winner: "if(self.king_victims.count > 0, self.colour, target.winner)"
          result: "if(self.king_victims.count > 0, if(self.colour == 'white', 'white_wins', 'black_wins'), target.result)"
          ended_by: "if(self.king_victims.count > 0, 'king_taken', target.ended_by)"
      # The move, recorded.
      - create: Move
        if: "not self.captured and self.from_file != null and not self.castled"
        set:
          game_id: self.game_id
          number: self.game.move_count
          colour: self.colour
          piece: "if(self.promoting, 'pawn', self.kind)"
          from_square: "substr('abcdefgh', self.from_file - 1, 1) + self.from_rank"
          to_square: self.square
          captured: "if(self.victims.count > 0, true, false)"
          san: "self.san + if(self.gives_check, '+', '')"
          check: self.gives_check
          # When it reached the server (created_at says so to the second; this
          # to the millisecond), and how long since the move before.
          at_ms: self.game.last_move_ms
          took_ms: "self.game.last_move_ms - self.game.prev_move_ms"
          left_ms: "if(self.colour == 'white', self.game.white_ms, self.game.black_ms)"
      # What was on the square is taken (after the game has seen it).
      - {via: victims, if: "not self.captured and self.from_file != null and not self.castled", set: {captured: "true", square: "null"}}
  Move:
    description: "One move of a game, in the order played"
    access: {parent: game_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: game_id, type: integer, required: true}
      - {name: number, type: integer, required: true}
      - {name: colour, type: enum, enum: Colour, required: true}
      - {name: piece, type: enum, enum: Kind, required: true}
      - {name: from_square, type: string, max: 2, label: "From"}
      - {name: to_square, type: string, max: 2, label: "To"}
      - {name: captured, type: boolean, default: false}
      - {name: san, type: string, max: 12, label: "Move"}
      - {name: check, type: boolean, default: false, label: "Check", description: "Whether the move gave check"}
      - {name: created_at, type: datetime, autogenerated: true, read_only: true, label: "At"}
      - {name: at_ms, type: integer, description: "When the move reached the server, in milliseconds since 1970"}
      - {name: took_ms, type: integer, label: "Took (ms)", description: "Time from the previous move (or the start) to this one reaching the server, in milliseconds"}
      - {name: left_ms, type: integer, label: "Clock (ms)", description: "What the mover had left on its clock after this move, in milliseconds; blank without a clock"}
    computed:
      - {name: took, label: "Took", expr: "round(took_ms / 1000, 1) + ' s'", when: "took_ms != null"}
      # The clock as a clock reads it, m:ss (nothing below zero).
      - {name: left, label: "Clock", expr: "duration(max(left_ms, 0) / 1000)", when: "left_ms != null"}
    relationships:
      belongs_to: [{target: Game, via: game_id, on_delete: cascade}]
  # A player's report that the game has ended — checkmate or stalemate — as
  # their board found it (the server only refuses moves; it never searches
  # for a mate). A game played from one browser ends on one report; a remote
  # game when both players report the same result (agreeing counts the
  # verdicts of this game with this verdict's result, itself included), or on
  # the winner's claim of checkmate when the position bears it out. One
  # verdict per player, game and ending, and only from a player of the game.
  # A draw offer is a verdict too (result draw, ended_by agreed): remotely
  # the other player accepts by making the same, from one browser it ends
  # the game at once; the offer is withdrawn by deleting it.
  Verdict:
    description: "A player's report that the game has ended, and how — or their offer of a draw"
    access: {owner: player_id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: game_id, type: integer, required: true}
      - {name: player_id, type: integer, required: true}
      - {name: result, type: enum, enum: Result, required: true, label: "Result"}
      - {name: ended_by, type: enum, enum: Ending, required: true, label: "Ended by"}
      # A claimed checkmate is checked against the position as the verdict is
      # made: the losing side and where its king stands, copied here so the
      # relationships below can read them (a where reads the record's own slots).
      - {name: loser, type: enum, enum: Colour, read_only: true, default_expr: "if(result == 'white_wins', 'black', if(result == 'black_wins', 'white', null))"}
      - {name: lk_file, type: integer, read_only: true, default_expr: "if(result == 'white_wins', game.black_king_file, if(result == 'black_wins', game.white_king_file, null))"}
      - {name: lk_rank, type: integer, read_only: true, default_expr: "if(result == 'white_wins', game.black_king_rank, if(result == 'black_wins', game.white_king_rank, null))"}
    relationships:
      belongs_to:
        # link: readable — black's account may name a game white's account owns (the check below keeps it to the players).
        - {target: Game, via: game_id, name: game, link: readable, on_delete: cascade}
        - {target: Player, via: player_id, name: player, on_delete: cascade}
      has_many:
        - {target: Verdict, name: agreeing, match: {game_id: game_id}, where: "result == self.result"}
        # What makes each square beside the losing king (lk_* + the offset) no
        # escape: one of its own pieces standing there, or a winning piece
        # attacking it — by geometry, or a slider with a clear line (vbtw_*).
        # Read only for a claimed checkmate (the trigger's if stops before them otherwise).
        - {target: Piece, name: blocked_n, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == self.lk_file and rank == (self.lk_rank + 1)) or (colour != self.loser and (file != self.lk_file or rank != (self.lk_rank + 1)) and ((kind == 'knight' and abs(file - self.lk_file) * abs(rank - (self.lk_rank + 1)) == 2) or (kind == 'pawn' and abs(file - self.lk_file) == 1 and rank - (self.lk_rank + 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - self.lk_file), abs(rank - (self.lk_rank + 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank + 1) or file == self.lk_file) or (kind == 'bishop' or kind == 'queen') and (file - rank == self.lk_file - (self.lk_rank + 1) or file + rank == self.lk_file + (self.lk_rank + 1))) and vbtw_n.count == 0))))"}
        - {target: Piece, name: blocked_ne, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file + 1) and rank == (self.lk_rank + 1)) or (colour != self.loser and (file != (self.lk_file + 1) or rank != (self.lk_rank + 1)) and ((kind == 'knight' and abs(file - (self.lk_file + 1)) * abs(rank - (self.lk_rank + 1)) == 2) or (kind == 'pawn' and abs(file - (self.lk_file + 1)) == 1 and rank - (self.lk_rank + 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file + 1)), abs(rank - (self.lk_rank + 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank + 1) or file == (self.lk_file + 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file + 1) - (self.lk_rank + 1) or file + rank == (self.lk_file + 1) + (self.lk_rank + 1))) and vbtw_ne.count == 0))))"}
        - {target: Piece, name: blocked_e, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file + 1) and rank == self.lk_rank) or (colour != self.loser and (file != (self.lk_file + 1) or rank != self.lk_rank) and ((kind == 'knight' and abs(file - (self.lk_file + 1)) * abs(rank - self.lk_rank) == 2) or (kind == 'pawn' and abs(file - (self.lk_file + 1)) == 1 and rank - self.lk_rank == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file + 1)), abs(rank - self.lk_rank)) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == self.lk_rank or file == (self.lk_file + 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file + 1) - self.lk_rank or file + rank == (self.lk_file + 1) + self.lk_rank)) and vbtw_e.count == 0))))"}
        - {target: Piece, name: blocked_se, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file + 1) and rank == (self.lk_rank - 1)) or (colour != self.loser and (file != (self.lk_file + 1) or rank != (self.lk_rank - 1)) and ((kind == 'knight' and abs(file - (self.lk_file + 1)) * abs(rank - (self.lk_rank - 1)) == 2) or (kind == 'pawn' and abs(file - (self.lk_file + 1)) == 1 and rank - (self.lk_rank - 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file + 1)), abs(rank - (self.lk_rank - 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank - 1) or file == (self.lk_file + 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file + 1) - (self.lk_rank - 1) or file + rank == (self.lk_file + 1) + (self.lk_rank - 1))) and vbtw_se.count == 0))))"}
        - {target: Piece, name: blocked_s, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == self.lk_file and rank == (self.lk_rank - 1)) or (colour != self.loser and (file != self.lk_file or rank != (self.lk_rank - 1)) and ((kind == 'knight' and abs(file - self.lk_file) * abs(rank - (self.lk_rank - 1)) == 2) or (kind == 'pawn' and abs(file - self.lk_file) == 1 and rank - (self.lk_rank - 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - self.lk_file), abs(rank - (self.lk_rank - 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank - 1) or file == self.lk_file) or (kind == 'bishop' or kind == 'queen') and (file - rank == self.lk_file - (self.lk_rank - 1) or file + rank == self.lk_file + (self.lk_rank - 1))) and vbtw_s.count == 0))))"}
        - {target: Piece, name: blocked_sw, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file - 1) and rank == (self.lk_rank - 1)) or (colour != self.loser and (file != (self.lk_file - 1) or rank != (self.lk_rank - 1)) and ((kind == 'knight' and abs(file - (self.lk_file - 1)) * abs(rank - (self.lk_rank - 1)) == 2) or (kind == 'pawn' and abs(file - (self.lk_file - 1)) == 1 and rank - (self.lk_rank - 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file - 1)), abs(rank - (self.lk_rank - 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank - 1) or file == (self.lk_file - 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file - 1) - (self.lk_rank - 1) or file + rank == (self.lk_file - 1) + (self.lk_rank - 1))) and vbtw_sw.count == 0))))"}
        - {target: Piece, name: blocked_w, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file - 1) and rank == self.lk_rank) or (colour != self.loser and (file != (self.lk_file - 1) or rank != self.lk_rank) and ((kind == 'knight' and abs(file - (self.lk_file - 1)) * abs(rank - self.lk_rank) == 2) or (kind == 'pawn' and abs(file - (self.lk_file - 1)) == 1 and rank - self.lk_rank == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file - 1)), abs(rank - self.lk_rank)) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == self.lk_rank or file == (self.lk_file - 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file - 1) - self.lk_rank or file + rank == (self.lk_file - 1) + self.lk_rank)) and vbtw_w.count == 0))))"}
        - {target: Piece, name: blocked_nw, match: {game_id: game_id},
           where: "captured == false and ((colour == self.loser and file == (self.lk_file - 1) and rank == (self.lk_rank + 1)) or (colour != self.loser and (file != (self.lk_file - 1) or rank != (self.lk_rank + 1)) and ((kind == 'knight' and abs(file - (self.lk_file - 1)) * abs(rank - (self.lk_rank + 1)) == 2) or (kind == 'pawn' and abs(file - (self.lk_file - 1)) == 1 and rank - (self.lk_rank + 1) == if(colour == 'white', -1, 1)) or (kind == 'king' and max(abs(file - (self.lk_file - 1)), abs(rank - (self.lk_rank + 1))) == 1) or (((kind == 'rook' or kind == 'queen') and (rank == (self.lk_rank + 1) or file == (self.lk_file - 1)) or (kind == 'bishop' or kind == 'queen') and (file - rank == (self.lk_file - 1) - (self.lk_rank + 1) or file + rank == (self.lk_file - 1) + (self.lk_rank + 1))) and vbtw_nw.count == 0))))"}
    constraints:
      unique: [[game_id, player_id, ended_by]]
    checks:
      - {check: "player_id == game.white_id or player_id == game.black_id", message: "only a player of the game reports its end", slot: player_id}
      - {check: "game.status == 'playing'", message: "the game is over already", slot: game_id}
      - {check: "ended_by != 'king_taken'", message: "a taken king ends the game by itself", slot: ended_by}
      - {check: "ended_by != 'agreed' or result == 'draw'", message: "an agreed end is a draw", slot: result}
    triggers:
      # The game ends: from one browser on this report; remotely once both
      # players agree — or on the winner's claim of checkmate alone, when the
      # position bears it out: the losing side is to move and in check, and
      # every square beside its king is off the board, one of its own pieces
      # or attacked (blocked_*). The server never searches for a mate; it
      # checks a claim, so a losing side that never reports can't keep the
      # game open. It doesn't look for a capture of the checking piece or a
      # block of the check: the board never claims a mate that isn't one, so
      # only a claim made around the board could end a game that way.
      - via: game_id
        if: "self.game.mode == 'in_person' or self.agreeing.count >= 2 or (self.ended_by == 'checkmate' and self.game.check == true and self.game.turn == self.loser and self.player_id == if(self.loser == 'white', self.game.black_id, self.game.white_id) and ((self.lk_rank + 1) > 8 or self.blocked_n.count > 0) and ((self.lk_file + 1) > 8 or (self.lk_rank + 1) > 8 or self.blocked_ne.count > 0) and ((self.lk_file + 1) > 8 or self.blocked_e.count > 0) and ((self.lk_file + 1) > 8 or (self.lk_rank - 1) < 1 or self.blocked_se.count > 0) and ((self.lk_rank - 1) < 1 or self.blocked_s.count > 0) and ((self.lk_file - 1) < 1 or (self.lk_rank - 1) < 1 or self.blocked_sw.count > 0) and ((self.lk_file - 1) < 1 or self.blocked_w.count > 0) and ((self.lk_file - 1) < 1 or (self.lk_rank + 1) > 8 or self.blocked_nw.count > 0))"
        set:
          status: "'finished'"
          winner: "if(self.result == 'white_wins', 'white', if(self.result == 'black_wins', 'black', null))"
          result: self.result
          ended_by: self.ended_by
          # A mate's move gets # in place of its +; then the score.
          pgn: "if(target.pgn == null, '', if(self.ended_by == 'checkmate' and substr(target.pgn, len(target.pgn) - 1, 1) == '+', substr(target.pgn, 0, len(target.pgn) - 1) + '#', target.pgn)) + if(self.result == 'white_wins', ' 1-0', if(self.result == 'black_wins', ' 0-1', ' 1/2-1/2'))"
