# A game of chess, described by its data alone. The framework knows nothing of
# chess: a game starts with its pieces (starts_with); a piece's square is a slot;
# the pieces on a square are a has_many by matching slots (match), whose where
# reads the piece as self.*; moving a piece writes its square, and the class's
# checks say what a legal move is (counts over those relationships: blockers,
# victims); triggers capture what was on the square, promote a pawn and hand the
# turn to the other side.
#
# Not described (a demonstration): castling, en passant, check and checkmate —
# a game ends when a king is taken.
enums:
  Colour: {values: [white, black]}
  Kind: {values: [king, queen, rook, bishop, knight, pawn]}
  Status: {values: [playing, finished]}
classes:
  Game:
    description: "A game between two players; white moves first"
    title: "white.name + ' vs ' + black.name"
    access: {owner: white_id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: white_id, type: integer, required: true, label: "White"}
      - {name: black_id, type: integer, required: true, label: "Black"}
      - {name: turn, type: enum, enum: Colour, default: white, read_only: true, label: "To move"}
      - {name: status, type: enum, enum: Status, default: playing, read_only: true}
      - {name: winner, type: enum, enum: Colour, read_only: true}
      - {name: move_count, type: integer, default: 0, read_only: true, label: "Moves"}
      - {name: last_move, type: string, read_only: true, label: "Last move"}
      - {name: last_piece_id, type: integer, read_only: true}
      - {name: last_square, type: string, read_only: true}
      - {name: pgn, type: text, read_only: true, label: "PGN", description: "The moves from the start, in portable game notation"}
    relationships:
      belongs_to:
        - {target: Player, via: white_id, name: white, link: readable}
        - {target: Player, via: black_id, name: black, link: readable}
      has_many:
        - {target: Piece, via: game_id, name: pieces}
        - {target: Move, via: game_id, name: moves}
    starts_with:
      pieces:
        - {colour: "'white'", kind: "'rook'", square: "'a1'", owner_id: white_id}
        - {colour: "'white'", kind: "'knight'", square: "'b1'", owner_id: white_id}
        - {colour: "'white'", kind: "'bishop'", square: "'c1'", owner_id: white_id}
        - {colour: "'white'", kind: "'queen'", square: "'d1'", owner_id: white_id}
        - {colour: "'white'", kind: "'king'", square: "'e1'", owner_id: white_id}
        - {colour: "'white'", kind: "'bishop'", square: "'f1'", owner_id: white_id}
        - {colour: "'white'", kind: "'knight'", square: "'g1'", owner_id: white_id}
        - {colour: "'white'", kind: "'rook'", square: "'h1'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'a2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'b2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'c2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'d2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'e2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'f2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'g2'", owner_id: white_id}
        - {colour: "'white'", kind: "'pawn'", square: "'h2'", owner_id: white_id}
        - {colour: "'black'", kind: "'rook'", square: "'a8'", owner_id: black_id}
        - {colour: "'black'", kind: "'knight'", square: "'b8'", owner_id: black_id}
        - {colour: "'black'", kind: "'bishop'", square: "'c8'", owner_id: black_id}
        - {colour: "'black'", kind: "'queen'", square: "'d8'", owner_id: black_id}
        - {colour: "'black'", kind: "'king'", square: "'e8'", owner_id: black_id}
        - {colour: "'black'", kind: "'bishop'", square: "'f8'", owner_id: black_id}
        - {colour: "'black'", kind: "'knight'", square: "'g8'", owner_id: black_id}
        - {colour: "'black'", kind: "'rook'", square: "'h8'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'a7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'b7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'c7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'d7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'e7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'f7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'g7'", owner_id: black_id}
        - {colour: "'black'", kind: "'pawn'", square: "'h7'", owner_id: black_id}
  Piece:
    description: "A piece of a game, on a square until it is taken; its owner moves it"
    access: {owner: owner_id, read: public, write: owner}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: game_id, type: integer, required: true}
      - {name: owner_id, type: integer, required: true}
      - {name: colour, type: enum, enum: Colour, required: true}
      - {name: kind, type: enum, enum: Kind, required: true}
      - {name: square, type: string, max: 2, description: "Where it stands, a–h then 1–8; blank once taken"}
      - {name: captured, type: boolean, default: false, label: "Taken"}
      - {name: file, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) + 1"}
      - {name: rank, type: integer, default_expr: "index('12345678', substr(square, 1, 1)) + 1"}
      - {name: diag_a, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) - index('12345678', substr(square, 1, 1))"}
      - {name: diag_b, type: integer, default_expr: "index('abcdefgh', substr(square, 0, 1)) + index('12345678', substr(square, 1, 1))"}
      - {name: from_file, type: integer}
      - {name: from_rank, type: integer}
      - {name: promoting, type: boolean, default: false}
    computed:
      # The move's notation, read while the trigger records it (the victims still there).
      - {name: san, expr: "if(kind == 'pawn' or promoting, if(victims.count > 0, substr('abcdefgh', from_file - 1, 1) + 'x', ''), if(kind == 'king', 'K', if(kind == 'queen', 'Q', if(kind == 'rook', 'R', if(kind == 'bishop', 'B', 'N')))) + if(victims.count > 0, 'x', '')) + square + if(promoting, '=Q', '')"}
      - {name: glyph, expr: "if(colour == 'white', if(kind == 'king', '♔', if(kind == 'queen', '♕', if(kind == 'rook', '♖', if(kind == 'bishop', '♗', if(kind == 'knight', '♘', '♙'))))), if(kind == 'king', '♚', if(kind == 'queen', '♛', if(kind == 'rook', '♜', if(kind == 'bishop', '♝', if(kind == 'knight', '♞', '♟'))))))"}
    relationships:
      belongs_to:
        - {target: Game, via: game_id, on_delete: cascade}
        - {target: Player, via: owner_id, name: owner, link: readable}
      has_many:
        # The pieces on this piece's square, other than itself.
        - {target: Piece, name: victims, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour != self.colour"}
        - {target: Piece, name: own_here, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour == self.colour"}
        - {target: Piece, name: king_victims, match: {game_id: game_id, square: square}, where: "id != self.id and captured == false and colour != self.colour and kind == 'king'"}
        # Pieces on the line of the last move, strictly between its squares.
        - {target: Piece, name: blockers, match: {game_id: game_id},
           where: "id != self.id and captured == false and file >= min(self.file, self.from_file) and file <= max(self.file, self.from_file) and rank >= min(self.rank, self.from_rank) and rank <= max(self.rank, self.from_rank) and (file != self.file or rank != self.rank) and ((rank == self.rank and self.rank == self.from_rank) or (file == self.file and self.file == self.from_file) or (diag_a == self.diag_a and self.file - self.rank == self.from_file - self.from_rank) or (diag_b == self.diag_b and self.file + self.rank == self.from_file + self.from_rank))"}
    on_change:
      - slot: square
        set:
          from_file: old.file
          from_rank: old.rank
          file: "index('abcdefgh', substr(square, 0, 1)) + 1"
          rank: "index('12345678', substr(square, 1, 1)) + 1"
          diag_a: "index('abcdefgh', substr(square, 0, 1)) - index('12345678', substr(square, 1, 1))"
          diag_b: "index('abcdefgh', substr(square, 0, 1)) + index('12345678', substr(square, 1, 1))"
          # A pawn reaching the last rank becomes a queen (the move is still checked as a pawn's).
          promoting: "old.kind == 'pawn' and (substr(square, 1, 1) == '8' or substr(square, 1, 1) == '1')"
          kind: "if(kind == 'pawn' and (substr(square, 1, 1) == '8' or substr(square, 1, 1) == '1'), 'queen', kind)"
    checks:
      - {check: "captured or from_file == null or game.status == 'playing'", message: "the game is over", slot: square}
      - {check: "captured or from_file == null or colour == game.turn", message: "it's not your turn", slot: square}
      - {check: "captured or from_file == null or own_here.count == 0", message: "one of your own pieces is there", slot: square}
      - {check: "captured or from_file == null or kind != 'king' or max(abs(file - from_file), abs(rank - from_rank)) == 1", message: "a king moves one square", slot: square}
      - {check: "captured or from_file == null or kind != 'queen' or promoting or ((abs(file - from_file) == abs(rank - from_rank) or file == from_file or rank == from_rank) and blockers.count == 0)", message: "a queen moves along a line, over empty squares", slot: square}
      - {check: "captured or from_file == null or kind != 'rook' or ((file == from_file or rank == from_rank) and blockers.count == 0)", message: "a rook moves along a rank or file, over empty squares", slot: square}
      - {check: "captured or from_file == null or kind != 'bishop' or (abs(file - from_file) == abs(rank - from_rank) and blockers.count == 0)", message: "a bishop moves along a diagonal, over empty squares", slot: square}
      - {check: "captured or from_file == null or kind != 'knight' or abs(file - from_file) * abs(rank - from_rank) == 2", message: "a knight moves two squares one way and one the other", slot: square}
      - {check: "captured or from_file == null or (kind != 'pawn' and not promoting) or (file == from_file and rank - from_rank == if(colour == 'white', 1, -1) and victims.count == 0) or (file == from_file and rank - from_rank == if(colour == 'white', 2, -2) and from_rank == if(colour == 'white', 2, 7) and victims.count == 0 and blockers.count == 0) or (abs(file - from_file) == 1 and rank - from_rank == if(colour == 'white', 1, -1) and victims.count == 1)", message: "a pawn moves one square forward (two from its first rank) and captures diagonally", slot: square}
    triggers:
      # Each fires for a piece that has moved (from_file is set by its first
      # move), in this order: the game, the move's record, then the capture.
      # The game: whose turn it is follows from the mover's colour (so a
      # repeated save changes nothing); the PGN grows; taking the king ends it.
      - via: game_id
        if: "not self.captured and self.from_file != null"
        set:
          turn: "if(self.colour == 'white', 'black', 'white')"
          move_count: "if(target.last_piece_id == self.id and target.last_square == self.square, target.move_count, target.move_count + 1)"
          last_piece_id: self.id
          last_square: self.square
          last_move: "self.colour + ' ' + self.kind + ' to ' + self.square"
          pgn: "if(target.pgn == null, '', target.pgn) + if(self.colour == 'white', if(target.move_count > 0, ' ', '') + (target.move_count / 2 + 1) + '. ', ' ') + self.san + if(self.king_victims.count > 0, if(self.colour == 'white', ' 1-0', ' 0-1'), '')"
          status: "if(self.king_victims.count > 0, 'finished', target.status)"
          winner: "if(self.king_victims.count > 0, self.colour, target.winner)"
      # The move, recorded.
      - create: Move
        if: "not self.captured and self.from_file != null"
        set:
          game_id: self.game_id
          number: self.game.move_count
          colour: self.colour
          piece: "if(self.promoting, 'pawn', self.kind)"
          from_square: "substr('abcdefgh', self.from_file - 1, 1) + self.from_rank"
          to_square: self.square
          captured: "if(self.victims.count > 0, true, false)"
          san: self.san
      # What was on the square is taken (after the game has seen it).
      - {via: victims, if: "not self.captured and self.from_file != null", set: {captured: "true", square: "null"}}
  Move:
    description: "One move of a game, in the order played"
    access: {parent: game_id}
    slots:
      - {name: id, type: integer, autogenerated: true, read_only: true}
      - {name: game_id, type: integer, required: true}
      - {name: number, type: integer, required: true}
      - {name: colour, type: enum, enum: Colour, required: true}
      - {name: piece, type: enum, enum: Kind, required: true}
      - {name: from_square, type: string, max: 2, label: "From"}
      - {name: to_square, type: string, max: 2, label: "To"}
      - {name: captured, type: boolean, default: false}
      - {name: san, type: string, max: 12, label: "Move"}
    relationships:
      belongs_to: [{target: Game, via: game_id, on_delete: cascade}]
