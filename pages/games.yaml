path: /games
title: Games
interface_views:
  - type: list
    data: {class: Game, order: "id desc"}
    fields: [white_id, black_id, mode, status, turn, move_count, last_move]
    filters: [{field: status}]
    page_size: 25
    add: {page: new-challenge, label: "Challenge a player"}
    empty: "No games yet. Start one."
